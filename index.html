let lang=localStorage.getItem("flagBattleLang")||"es";
let flags=[],bracket=[],winners=[],round=1,group=0,selectedId=null,sessionId=null,sort="elo",selectedDetail=null;
const $=id=>document.getElementById(id);
const txt=k=>T[lang][k];
const cname=n=>lang==="en"?(EN[n]||n):n;
const capitalName=c=>lang==="en"?(CAPITAL_EN[c]||c):c;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function screen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function nav(id){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}

function setLanguage(v){
  lang=v==="en"?"en":"es"; localStorage.setItem("flagBattleLang",lang); document.documentElement.lang=lang;
  $("questionTitle").textContent=txt("choose"); $("questionSub").textContent=txt("tap");
  $("hint1").textContent=txt("chooseMost"); $("hint2").textContent=txt("noRight");
  $("winnerTitle").textContent=txt("winner"); $("gameStatsTitle").textContent=txt("gameStats");
  $("roundsLabel").textContent=txt("rounds"); $("groupsLabel").textContent=txt("cleared");
  $("flagsSeenLabel").textContent=txt("seen"); $("selectionsLabel").textContent=txt("selections");
  $("newGame").textContent=txt("again"); $("share").textContent=txt("share");
  $("rankingTitle").textContent="♛ "+txt("world"); $("rankingDesc").textContent=txt("desc");
  $("winsTab").textContent=txt("wins"); $("rateTab").textContent=txt("rate"); $("flagHead").textContent=txt("flag"); $("winsHead").textContent=txt("wins");
  $("back").textContent="← "+txt("back"); $("detailBack").textContent="← "+txt("back2");
  $("navPlayText").textContent=txt("play"); $("navRankText").textContent=txt("ranking");
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  if(bracket.length && $("game").classList.contains("active")) renderGame();
  if($("ranking").classList.contains("active")) renderRanking();
  if(selectedDetail && $("detail").classList.contains("active")) renderDetail(selectedDetail);
}
document.querySelectorAll(".lang-btn").forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));

async function loadFlags(){
  const {data,error}=await db.from("flags").select("id,name,capital,emoji,elo,wins,games,losses").order("id");
  if(error) throw error;
  if(!data || data.length!==195) throw new Error("Expected 195 flags, got "+(data?.length||0));
  const missing=data.filter(x=>!x.capital);
  if(missing.length) throw new Error("Missing capital for "+missing.length+" flags");
  return data;
}

async function start(){
  sessionId=crypto.randomUUID(); selectedId=null; winners=[]; round=1; group=0;
  try{ flags=await loadFlags(); }
  catch(e){
    console.error("loadFlags",e);
    flags=FLAGS.map((x,i)=>({id:i+1,name:x[0],capital:"",emoji:x[1],elo:1000,wins:0,games:0,losses:0}));
  }
  bracket=shuffle(flags).slice(0,64); $("flagsSeen").textContent="64"; screen("game"); nav("navPlay"); renderGame();
}

function renderGame(){
  const total=round===1?16:round===2?4:1;
  $("roundText").textContent=`${txt("round")} ${round} de 3`;
  $("remainingText").textContent=`${total-group} ${total-group===1?txt("group"):txt("groups")}`;
  $("progressBar").style.width=`${Math.round(group/total*100)}%`;
  const four=bracket.slice(group*4,group*4+4); $("grid").innerHTML="";
  four.forEach(f=>{
    const b=document.createElement("button"); b.className="flag-card"; b.type="button";
    b.innerHTML=`<div class="flag-img">${f.emoji}</div><div class="flag-name">${cname(f.name)}</div><div class="flag-capital">${capitalName(f.capital||"")}</div><div class="elo">ELO ${Math.round(f.elo)}</div>`;
    b.onclick=()=>choose(f,b,four); $("grid").appendChild(b);
  });
}

async function choose(f,b,four){
  if(selectedId!==null) return;
  selectedId=f.id; b.classList.add("selected");
  document.querySelectorAll(".flag-card").forEach(x=>{if(x!==b)x.classList.add("dim")});
  try{
    const opponents=four.filter(x=>x.id!==f.id).map(x=>x.id);
    const {error}=await db.rpc("record_choice",{p_session_id:sessionId,p_winner_flag_id:f.id,p_opponent_flag_ids:opponents});
    if(error) throw error;
  }catch(e){console.error("record_choice",e)}
  setTimeout(()=>{
    winners.push(f); group++; selectedId=null;
    const total=round===1?16:round===2?4:1;
    if(group<total) renderGame();
    else if(round<3){bracket=winners; winners=[]; round++; group=0; renderGame();}
    else finish(f);
  },450);
}

function finish(f){$("winnerFlag").textContent=f.emoji; $("winnerName").textContent=cname(f.name).toUpperCase(); screen("result"); nav("navPlay")}

async function renderRanking(){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.sort===sort));
  screen("ranking"); nav("navRank"); $("rankingBody").innerHTML=`<div style="padding:20px;text-align:center">${txt("loading")}</div>`;
  try{
    const {data,error}=await db.from("flags").select("id,name,capital,emoji,elo,wins,games,losses");
    if(error) throw error;
    let a=data||[];
    a.sort((x,y)=>sort==="wins"?y.wins-x.wins:sort==="rate"?(y.wins/(y.games||1))-(x.wins/(x.games||1)):y.elo-x.elo);
    $("rankingBody").innerHTML=a.map((f,i)=>`<button type="button" class="row ranking-row" data-flag-id="${f.id}"><div class="rank-num">${i+1}</div><div><span class="mini">${f.emoji}</span>${cname(f.name)}</div><div><b>${Math.round(f.elo)}</b></div><div>${f.wins}</div><div>${f.games?Math.round(100*f.wins/f.games):0}%</div></button>`).join("");
$("rankingBody").querySelectorAll(".ranking-row").forEach(b=>b.onclick=()=>openFlagProfile(Number(b.dataset.flagId)));
  }catch(e){console.error("ranking",e);$("rankingBody").innerHTML=`<div style="padding:20px;text-align:center">${txt("empty")}</div>`}
}

function renderDetail(f, rank){
  screen("detail");
  nav("navRank");
  $("detailName").textContent=cname(f.name).toUpperCase();
  $("detailFlag").textContent=f.emoji;
  $("detailRank").textContent=rank ? `#${rank} · ${txt("world")}` : "";
  $("detailStats").innerHTML=`<div class="stat-row"><span>${txt("capital")}</span><b>${capitalName(f.capital||"")}</b></div><div class="stat-row"><span>ELO</span><b>${Math.round(f.elo)}</b></div><div class="stat-row"><span>${txt("wins")}</span><b>${f.wins}</b></div><div class="stat-row"><span>${txt("losses")}</span><b>${f.losses}</b></div><div class="stat-row"><span>${txt("games")}</span><b>${f.games}</b></div><div class="stat-row"><span>${txt("rate")}</span><b>${f.games?Math.round(100*f.wins/f.games):0}%</b></div>`;
}
function openFlagProfile(id){
  const sorted=[...flags].sort((a,b)=>b.elo-a.elo);
  const rank=sorted.findIndex(x=>x.id===id)+1;
  const f=sorted.find(x=>x.id===id);
  if(f){ selectedDetail=f; renderDetail(f,rank); }
}

$("navPlay").onclick=start; $("navRank").onclick=renderRanking;
$("newGame").onclick=start; $("back").onclick=start; $("detailBack").onclick=renderRanking;
$("share").onclick=async()=>{const text=`${txt("winner")}: ${$("winnerName").textContent} ${$("winnerFlag").textContent}`;try{if(navigator.share)await navigator.share({title:"Flag Battle",text});else await navigator.clipboard.writeText(text)}catch(e){}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{sort=b.dataset.sort;renderRanking()});
setLanguage(lang); start();
</script>
